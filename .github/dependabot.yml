version: 2
updates:
  # Bumps the SHA-pinned actions in .github/workflows and keeps their
  # "# vX.Y.Z" comments in sync. The cooldown skips releases younger than a
  # week, which gives time for a hijacked release to be caught and pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
