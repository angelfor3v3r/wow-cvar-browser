name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# One run per ref. A newer push cancels an older branch run, but never a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Unsupported release tag $GITHUB_REF_NAME. Expected vMAJOR.MINOR.PATCH."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1

      - name: Syntax check
        run: luac5.1 -p src/*.lua tests/harness.lua

      - name: TOC lists every source file
        # The harness and the package both follow the TOC, so a file missing
        # from it would ship untested or not at all.
        run: |
          diff <(ls src/*.lua | sort) <(grep -E '\.lua$' CVarBrowser.toc | tr '\\' '/' | sort)

      - name: Stub harness
        env:
          LUAC: luac5.1
        run: lua5.1 tests/harness.lua

      - name: Repository TOC is a dev build
        # Release zips get the real version from the tag. The checked-in TOC
        # stays "dev" so a copy of the repository is never mistaken for one.
        run: |
          grep -qx '## Version: dev' CVarBrowser.toc

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          root="dist/CVarBrowser"
          mkdir -p "$root/media" "$root/src"
          cp README.md "$root/"
          # Ship the Lua files the TOC loads, in their src/ folder.
          mapfile -t lua_files < <(grep -E '\.lua$' CVarBrowser.toc | tr '\\' '/')
          (( ${#lua_files[@]} > 0 ))
          for lua_file in "${lua_files[@]}"; do
            cp "$lua_file" "$root/$lua_file"
          done
          # Stamp the tag's version and the build (short commit hash and
          # commit date) into the shipped TOC, and prove it took. The window
          # subtitle shows "v<version> · <hash>" from these two fields.
          build="${GITHUB_SHA::7} $(git log -1 --format=%cs)"
          sed "s/^## Version:.*/## Version: $version\n## X-Build: $build/" \
            CVarBrowser.toc > "$root/CVarBrowser.toc"
          grep -qx "## Version: $version" "$root/CVarBrowser.toc"
          grep -qx "## X-Build: $build" "$root/CVarBrowser.toc"
          # Ship only the fonts the addon loads (MEDIA_PATH .. "<file>").
          mapfile -t fonts < <(grep -oh 'MEDIA_PATH \.\. "[^"]*"' src/*.lua | sed 's/.*"\(.*\)"/\1/' | sort -u)
          (( ${#fonts[@]} > 0 ))
          for font in "${fonts[@]}"; do
            cp "media/$font" "$root/media/"
          done
          zip="dist/CVarBrowser-$version.zip"
          (cd dist && zip -r -X "${zip#dist/}" CVarBrowser)
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Verify package
        run: |
          set -euo pipefail
          # The zip must hold one CVarBrowser/ folder with the TOC, the Lua
          # files the TOC lists, README, and fonts.
          expected=$(printf '%s\n' CVarBrowser/CVarBrowser.toc CVarBrowser/README.md; \
            grep -E '\.lua$' CVarBrowser.toc | tr '\\' '/' | sed 's/^/CVarBrowser\//'; \
            grep -oh 'MEDIA_PATH \.\. "[^"]*"' src/*.lua \
            | sed 's/.*"\(.*\)"/CVarBrowser\/media\/\1/' | sort -u)
          actual=$(unzip -Z1 "$ZIP" | grep -v '/$')
          diff <(sort <<<"$expected") <(sort <<<"$actual")
          unzip -l "$ZIP"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "CVar Browser $GITHUB_REF_NAME" \
            --generate-notes
